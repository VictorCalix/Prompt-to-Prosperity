<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidad | Prompt to Prosperity</title>
  <meta name="description" content="Miembros y negocios participantes de Prompt to Prosperity.">
  <link rel="icon" type="image/png" href="assets/Logos/favicon-bot.png">
  <link rel="apple-touch-icon" href="assets/Logos/favicon-bot.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="community-page-body">
  <header class="site-header">
    <div class="header-identity">
      <a class="brand" href="index.html#inicio" aria-label="Ir al inicio">
        <img class="brand-logo" src="assets/Logos/Logo%20Grande.png" alt="Prompt to Prosperity">
      </a>
    </div>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="index.html#sobre">Sobre el programa</a>
      <a href="index.html#programa">Programa</a>
      <a href="comunidad.html" aria-current="page">Comunidad</a>
    </nav>
  </header>

  <main id="comunidad">
    <section class="section community-section community-page">
      <div class="section-heading">
        <div class="section-title-row community-title-row">
          <span class="section-icon" aria-hidden="true">
            <svg class="community-mark" viewBox="0 0 24 24">
              <path d="M16.5 20.5v-1.2c0-2.8-2.3-5.1-5.1-5.1H7.6c-2.8 0-5.1 2.3-5.1 5.1v1.2"></path>
              <circle cx="9.5" cy="7.6" r="4.1"></circle>
              <path d="M21.5 20.5v-1c0-2.3-1.5-4.3-3.7-4.9"></path>
              <path d="M16.7 3.2a4.1 4.1 0 0 1 0 7.9"></path>
            </svg>
          </span>
          <h1>Miembros y negocios participantes</h1>
        </div>
      </div>

      <div class="directory-layout community-directory-layout">
        <section class="members-directory">
          <div class="directory-heading">
            <h2>Miembros</h2>
            <span id="memberCount">0</span>
          </div>
          <div class="directory-scroll member-scroll" aria-label="Listado de miembros">
            <div id="membersGrid" class="card-grid member-grid"></div>
          </div>
        </section>

        <section class="businesses-directory">
          <div class="directory-heading">
            <h2>Negocios</h2>
            <span id="businessCount">0</span>
          </div>

          <div class="business-filters" aria-label="Filtros de negocios">
            <div class="filter-control">
              <span id="generationFilterLabel">Generación</span>
              <button id="generationFilter" class="filter-trigger" type="button" data-value="" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="generationFilterLabel generationFilter">Todas</button>
              <div id="generationFilterMenu" class="filter-menu" role="listbox" aria-labelledby="generationFilterLabel"></div>
            </div>
            <div class="filter-control">
              <span id="categoryFilterLabel">Categoría</span>
              <button id="categoryFilter" class="filter-trigger" type="button" data-value="" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="categoryFilterLabel categoryFilter">Todas</button>
              <div id="categoryFilterMenu" class="filter-menu" role="listbox" aria-labelledby="categoryFilterLabel"></div>
            </div>
          </div>

          <div class="directory-scroll business-scroll" aria-label="Listado de negocios">
            <div id="businessesGrid" class="card-grid business-grid" data-card-links="false"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Prompt to Prosperity</p>
    <div class="footer-links">
      <a class="social-link social-instagram" href="https://www.instagram.com/prompttoprosperity/" target="_blank" rel="noopener" aria-label="Instagram de Prompt to Prosperity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.4" cy="6.7" r="1"></circle></svg>
        <span>@prompttoprosperity</span>
      </a>
      <a class="social-link social-tiktok" href="https://www.tiktok.com/@prompttoprosperity" target="_blank" rel="noopener" aria-label="TikTok de Prompt to Prosperity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 4v9.1a4.1 4.1 0 1 1-3.1-4V6.3a7.1 7.1 0 1 0 6 7V8.7a7.7 7.7 0 0 0 4.1 1.2V7.1A4.9 4.9 0 0 1 17 4h-3z"></path></svg>
        <span>@prompttoprosperity</span>
      </a>
      <a class="social-link social-linkedin" href="https://www.linkedin.com/company/prompttoprosperity/" target="_blank" rel="noopener" aria-label="LinkedIn de Prompt to Prosperity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="8" width="4" height="12"></rect><circle cx="6" cy="5" r="2"></circle><path d="M11 8h4v1.7a4.3 4.3 0 0 1 3.3-1.9c2.7 0 4.7 1.8 4.7 5.5V20h-4v-6.1c0-1.7-.6-2.8-2-2.8-1.1 0-1.8.8-2.1 1.5-.1.3-.1.7-.1 1V20h-4V8z"></path></svg>
        <span>Prompt to Prosperity</span>
      </a>
      <a class="social-link social-facebook" href="https://www.facebook.com/prompttoprosperity" target="_blank" rel="noopener" aria-label="Facebook de Prompt to Prosperity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 8h2V4h-3c-3 0-5 2-5 5v2H6v4h2v5h4v-5h3l1-4h-4V9c0-.6.4-1 1-1h1z"></path></svg>
        <span>@prompttoprosperity</span>
      </a>
      <a class="social-link social-threads" href="https://www.threads.com/prompttoprosperity" target="_blank" rel="noopener" aria-label="Threads de Prompt to Prosperity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17.4 10.6c-.4-3.4-2.5-5.5-5.8-5.5-3.7 0-6.3 2.8-6.3 6.9 0 4.2 2.8 6.9 7.1 6.9 3.3 0 5.6-1.5 5.6-4.1 0-2.4-2-3.6-5-3.6h-1.2c-1.5 0-2.5.8-2.5 2 0 1.3 1.1 2.1 2.6 2.1 1.6 0 2.6-.9 2.6-2.2"></path><path d="M8.7 10.2c.1-1.8 1.4-3 3.2-3 1.5 0 2.5.7 3.1 2"></path></svg>
        <span>@prompttoprosperity</span>
      </a>
    </div>
  </footer>

  <div id="asistente" class="floating-actions" aria-label="Preguntas frecuentes">
    <section id="chatPanel" class="floating-chat" aria-label="Chatbot de preguntas frecuentes" aria-hidden="true">
      <div class="floating-chat-header">
        <div>
          <span>P2P-BOT</span>
          <strong>A tus órdenes</strong>
        </div>
        <button id="closeChat" class="icon-button" type="button" aria-label="Cerrar chatbot">x</button>
      </div>
      <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
      <div id="suggestedQuestions" class="question-list compact"></div>
      <form id="chatForm" class="chat-form">
        <label class="sr-only" for="chatInput">Escribe tu pregunta</label>
        <input id="chatInput" type="text" placeholder="Escribe para ver preguntas similares..." autocomplete="off">
      </form>
    </section>

    <div class="floating-controls">
      <button id="chatToggle" class="chat-bubble" type="button" aria-label="Abrir chatbot" aria-expanded="false" aria-controls="chatPanel">
        <img src="assets/Logos/chatbot-bot.png" alt="">
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
